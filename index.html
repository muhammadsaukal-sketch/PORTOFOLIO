<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SYAUQAL PORTOFOLIO</title>
    <meta
      name="description"
      content="Website Portofolio Syauqal"
    />
    <link
      rel="icon"
      href="https://upload.wikimedia.org/wikipedia/id/2/2d/Undip.png"
      type="image/x-icon"
    />
    <style>
      /* CSS Reset untuk Fullscreen Sempurna */
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        /* Ganti height 100% dengan 100dvh agar pas dengan address bar browser HP */
        height: 100dvh; 
        overflow: hidden; /* Mencegah scrollbar ganda */
        
        /* PERBAIKAN UTAMA: */
        /* Mengubah warna background dari gelap (#020617) ke warna tema portofolio (#fbfbfd) */
        background-color: #fbfbfd; 
        
        /* Mencegah efek pantulan/bounce saat scroll mentok di iOS */
        overscroll-behavior: none;
      }

      iframe {
        border: none;
        width: 100%;
        height: 100%;
        display: block; /* Menghilangkan celah garis di bawah iframe */
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://script.google.com/macros/s/AKfycbz87hz-2NjLrUM6OJLOn00WGlxZCXMU5Y54xBaFKGJPQzTGOcLS7PcR3zI9GqyCvQ54vg/exec"
      allow="fullscreen; clipboard-read; clipboard-write; autoplay; camera; microphone"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true">
    </iframe>
  </body>
</html>
