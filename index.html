<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    
    <title>SYAUQAL PORTOFOLIO</title>
    <meta name="description" content="Website Portofolio Syauqal" />
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/id/2/2d/Undip.png" type="image/x-icon" />

    <meta name="theme-color" content="#fbfbfd" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
      /* Reset CSS */
      * {
        box-sizing: border-box;
      }

      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        /* Menggunakan 100dvh untuk mengakomodasi address bar yang naik turun */
        height: 100dvh; 
        overflow: hidden;
        
        /* Warna background wrapper HARUS sama dengan web biar seamless */
        background-color: #fbfbfd;
        
        /* Mencegah bounce scroll */
        overscroll-behavior: none;
      }

      /* Container Iframe */
      .iframe-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 1;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="iframe-container">
      <iframe
        src="https://script.google.com/macros/s/AKfycbz87hz-2NjLrUM6OJLOn00WGlxZCXMU5Y54xBaFKGJPQzTGOcLS7PcR3zI9GqyCvQ54vg/exec"
        allow="fullscreen; clipboard-read; clipboard-write; autoplay; camera; microphone"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
      </iframe>
    </div>
  </body>
</html>
