<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SYAUQAL PORTOFOLIO</title>
    <meta
      name="description"
      content="Website Portofolio Syauqal"
    />
    <link
      rel="icon"
      href="https://upload.wikimedia.org/wikipedia/id/2/2d/Undip.png"
      type="image/x-icon"
    />
    <style>
      /* --- RESET & FULLSCREEN FIX --- */
      * {
        box-sizing: border-box;
      }

      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        
        /* Gunakan 100dvh (Dynamic Viewport Height) untuk menangani address bar */
        height: 100vh; 
        height: 100dvh; 
        
        /* PENTING: Position Fixed mengunci layar agar tidak 'lari' saat address bar browser naik turun */
        position: fixed; 
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        
        overflow: hidden; /* Hilangkan scroll di pembungkus, biarkan iframe yang scroll */
        background-color: #fbfbfd; /* Samakan dengan warna tema */
        overscroll-behavior: none; /* Matikan efek pantul (bounce) di iOS */
      }

      /* Container untuk memastikan iframe tetap pada tempatnya */
      .iframe-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-overflow-scrolling: touch; /* Smooth scroll untuk iOS lama */
      }

      iframe {
        border: none;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="iframe-container">
      <iframe
        src="https://script.google.com/macros/s/AKfycbz87hz-2NjLrUM6OJLOn00WGlxZCXMU5Y54xBaFKGJPQzTGOcLS7PcR3zI9GqyCvQ54vg/exec"
        allow="fullscreen; clipboard-read; clipboard-write; autoplay; camera; microphone"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
      </iframe>
    </div>
  </body>
</html>
